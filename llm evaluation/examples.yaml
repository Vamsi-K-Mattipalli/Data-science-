                Qualifying Events and Coverage Periods
                Termination (other than by reason of such employee's gross misconduct) of the covered employee's employment - 18 months
                Reduction of hours of the covered employee's employment - 18 months
                For coverage employees who are retirees of the employer, the employer's bankruptcy under Title 11 of the United States Code - 36 months for spouse and child
                Death of the covered employee - 36 months for spouse and child
                Divorce or legal separation of the covered employee from the employee's spouse - 36 months for spouse and child
                Dependent child no longer meets plan's definition of dependent - 36 months for child
                Enrollment Period
                Once a qualifying event has occurred, the COBRA-eligible individuals have 60 days from the latest of one of the following:
                Date of qualifying event
                Date qualified beneficiary would lose coverage
                Date qualified beneficiary is informed of the beneficiary's obligation to provide notice to elect to continue the coverage
                No lapse in coverage can occur. Coverage will be retroactive to the date of the qualifying event or loss of coverage date (date benefits terminate).
                Note:
